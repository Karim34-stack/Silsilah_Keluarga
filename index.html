<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Silsilah Keluarga</title><?!=include('style')?></head><body><header><div><h1>Silsilah Keluarga</h1><p>Data keluarga, alamat, dan lokasi Google Maps</p></div><div><button id="login" class="btn secondary">Login Admin</button><button id="logout" class="btn danger hidden">Logout</button></div></header><main><section class="toolbar"><input id="search" placeholder="Cari nama, hubungan, alamat..."><button id="add" class="btn primary">+ Tambah Silsilah</button></section><div id="status">Memuat data...</div><section id="grid" class="grid"></section></main><div id="detail" class="modal hidden"><div class="box"><button class="close" onclick="hide('detail')">×</button><div id="detailBody"></div></div></div><div id="form" class="modal hidden"><div class="box"><button class="close" onclick="hide('form')">×</button><h2 id="formTitle">Tambah Silsilah</h2><form id="personForm"><input type="hidden" id="id"><label>Nama<input id="nama" required></label><label>Jenis Kelamin<select id="jenisKelamin"><option value="">Pilih</option><option>Laki-laki</option><option>Perempuan</option></select></label><label>Tanggal Lahir<input id="tanggalLahir" type="date"></label><label>Hubungan<input id="hubungan" placeholder="Ayah, Ibu, Anak, dll."></label><label>Ayah<input id="ayah"></label><label>Ibu<input id="ibu"></label><label>Pasangan<input id="pasangan"></label><label>Alamat<input id="alamat" placeholder="Alamat lengkap"></label><label>Deskripsi<textarea id="deskripsi" rows="4"></textarea></label><label>Foto<input id="fotoFile" type="file" accept="image/*"></label><input type="hidden" id="foto"><div id="preview"></div><div class="actions"><button type="button" class="btn secondary" onclick="hide('form')">Batal</button><button class="btn primary">Simpan</button></div></form></div></div><div id="loginModal" class="modal hidden"><div class="box small"><button class="close" onclick="hide('loginModal')">×</button><h2>Login Admin</h2><form id="loginForm"><label>Username<input id="username" required></label><label>Password<input id="password" type="password" required></label><button class="btn primary full">Login</button></form></div></div><div id="lightbox" class="lightbox hidden"><button class="close" onclick="hide('lightbox')">×</button><img id="bigImg"></div><?!=include('script')?></body></html>
