<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silsilah Keluarga</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icon CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

    <!-- Header Navigation Bar -->
    <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-50 px-6 py-4 flex flex-wrap items-center justify-between gap-4">
        <div class="flex items-center gap-3">
            <div class="p-2 bg-emerald-500/10 text-emerald-400 rounded-xl">
                <i class="fa-solid fa-sitemap text-xl"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-none">SILSILAH KELUARGA</h1>
                <p class="text-xs text-slate-400 mt-1">Database Berbagi & Visualisasi Pohon Keluarga</p>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <span class="inline-flex items-center gap-2 px-3 py-1.5 rounded-lg bg-slate-800 text-xs text-emerald-400 border border-slate-700/60">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Google Sheets Terhubung
            </span>
            <button class="p-2 text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 rounded-lg transition">
                <i class="fa-solid fa-rotate"></i>
            </button>
            <button class="px-3 py-1.5 text-xs bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-700 flex items-center gap-2">
                <i class="fa-solid fa-lock text-xs"></i> Mode Admin
            </button>
        </div>
    </header>

    <!-- Main Toolbar Filter & Control Bar -->
    <main class="p-6">
        <div class="bg-slate-900/80 p-3 rounded-2xl border border-slate-800 mb-6 flex flex-wrap items-center justify-between gap-3">
            <div class="flex flex-wrap items-center gap-3 flex-1">
                <!-- Search Input -->
                <div class="relative min-w-[200px]">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                    <input type="text" id="search-input" placeholder="Cari nama anggota..." class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-8 pr-3 py-2 text-xs focus:outline-none focus:border-emerald-500/50">
                </div>

                <!-- Dropdown Search Akar / Pangkal Silsilah -->
                <select id="filter-root" onchange="renderApp()" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-emerald-500/50">
                    <option value="ALL">Semua Akar (Pohon Utama)</option>
                </select>

                <!-- Dropdown Filter Generasi -->
                <select id="filter-gen" onchange="renderApp()" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-emerald-500/50">
                    <option value="ALL">Semua Generasi</option>
                </select>

                <!-- Total Indicator -->
                <span id="total-badge" class="px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-slate-400 flex items-center gap-1.5">
                    <i class="fa-solid fa-users text-emerald-400"></i> Total: <strong id="total-count" class="text-emerald-400">0</strong> Anggota
                </span>
            </div>

            <!-- Zoom & Action Controls -->
            <div class="flex items-center gap-2">
                <!-- KONTROL ZOOM -->
                <div class="zoom-controls">
                    <button onclick="zoomTree(-0.1)" title="Perkecil (Zoom Out)" class="zoom-btn">
                        <i class="fa-solid fa-magnifying-glass-minus"></i>
                    </button>
                    <span id="zoom-level" class="px-2 text-emerald-400 font-bold min-w-[45px] text-center">100%</span>
                    <button onclick="zoomTree(0.1)" title="Perbesar (Zoom In)" class="zoom-btn">
                        <i class="fa-solid fa-magnifying-glass-plus"></i>
                    </button>
                    <button onclick="resetZoom()" title="Reset Zoom" class="zoom-btn border-l border-slate-800 ml-1">
                        <i class="fa-solid fa-rotate-left"></i>
                    </button>
                </div>

                <div class="flex bg-slate-950 p-1 rounded-xl border border-slate-800 text-xs">
                    <button id="btn-pohon" onclick="switchView('pohon')" class="px-3 py-1.5 rounded-lg bg-emerald-500 text-white font-medium flex items-center gap-1.5">
                        <i class="fa-solid fa-diagram-project"></i> Pohon
                    </button>
                    <button id="btn-grid" onclick="switchView('grid')" class="px-3 py-1.5 rounded-lg text-slate-400 hover:text-white flex items-center gap-1.5">
                        <i class="fa-solid fa-border-all"></i> Grid
                    </button>
                </div>

                <button class="px-3 py-2 bg-rose-600 hover:bg-rose-500 text-white rounded-xl text-xs font-medium flex items-center gap-2 transition">
                    <i class="fa-solid fa-file-pdf"></i> Export PDF
                </button>
                <button class="px-3 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-medium flex items-center gap-2 transition">
                    <i class="fa-solid fa-user-plus"></i> Tambah Anggota
                </button>
            </div>
        </div>

        <!-- Tree Canvas / Container -->
        <div id="tree-container" class="bg-slate-900/40 rounded-3xl border border-slate-800/80 min-h-[600px] flex items-center justify-center">
            <!-- Tampilan Pohon dirender via script.js -->
        </div>
    </main>

    <!-- App Script -->
    <script src="script.js"></script>
</body>
</html>
