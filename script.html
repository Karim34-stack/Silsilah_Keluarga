<script>let data=[],token=sessionStorage.getItem('adminToken')||'';const $=x=>document.getElementById(x);const call=(fn,...a)=>new Promise((r,j)=>google.script.run.withSuccessHandler(r).withFailureHandler(j)[fn](...a));document.addEventListener('DOMContentLoaded',()=>{load();$('login').onclick=()=>show('loginModal');$('logout').onclick=doLogout;$('add').onclick=()=>openForm();$('search').oninput=render;$('personForm').onsubmit=save;$('loginForm').onsubmit=doLogin;$('fotoFile').onchange=preview});async function load(){try{data=await call('getData');render();$('status').textContent=data.length+' data keluarga';ui()}catch(e){$('status').textContent='Gagal memuat data: '+e.message}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function maps(a){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(a)}function route(a){return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(a)}function render(){let q=$('search').value.toLowerCase(),arr=data.filter(p=>Object.values(p).join(' ').toLowerCase().includes(q));$('grid').innerHTML=arr.map(p=>{let img=p.foto?`<img src="${esc(p.foto)}" onclick="big('${esc(p.foto)}')">`:`<div class="noimg">Tidak ada foto</div>`;let map=p.alamat?`<div class="address"><b>Alamat:</b><br>${esc(p.alamat)}<div class="maplinks"><a class="btn secondary" target="_blank" href="${maps(p.alamat)}">📍 Lihat di Maps</a><a class="btn primary" target="_blank" href="${route(p.alamat)}">🧭 Rute</a></div></div>`:'';return `<article class="person">${img}<div class="body"><h3>${esc(p.nama)}</h3><div class="muted">${esc(p.hubungan)} ${p.jenisKelamin?'• '+esc(p.jenisKelamin):''}</div>${map}<p>${esc(p.deskripsi)}</p><button class="btn secondary" onclick="detail('${esc(p.id)}')">Detail</button>${token?`<div class="actions"><button class="btn secondary" onclick="openForm('${esc(p.id)}')">Edit</button><button class="btn danger" onclick="del('${esc(p.id)}')">Hapus</button></div>`:''}</div></article>`}).join('')||'<div>Data tidak ditemukan.</div>'}function detail(id){let p=data.find(x=>String(x.id)==String(id));if(!p)return;$('detailBody').innerHTML=`${p.foto?`<img class="detailPhoto" src="${esc(p.foto)}" onclick="big('${esc(p.foto)}')">`:''}<h2>${esc(p.nama)}</h2><p><b>Jenis Kelamin:</b> ${esc(p.jenisKelamin)}</p><p><b>Tanggal Lahir:</b> ${esc(p.tanggalLahir)}</p><p><b>Hubungan:</b> ${esc(p.hubungan)}</p><p><b>Ayah:</b> ${esc(p.ayah)}</p><p><b>Ibu:</b> ${esc(p.ibu)}</p><p><b>Pasangan:</b> ${esc(p.pasangan)}</p><p><b>Alamat:</b><br>${esc(p.alamat)}</p>${p.alamat?`<div class="maplinks"><a class="btn secondary" target="_blank" href="${maps(p.alamat)}">📍 Buka Google Maps</a><a class="btn primary" target="_blank" href="${route(p.alamat)}">🧭 Dapatkan Rute</a></div>`:''}<p>${esc(p.deskripsi)}</p>`;show('detail')}function openForm(id){if(id&&!token){alert('Login admin diperlukan untuk edit.');return}$('personForm').reset();$('id').value='';$('foto').value='';$('preview').innerHTML='';$('formTitle').textContent=id?'Edit Silsilah':'Tambah Silsilah';if(id){let p=data.find(x=>String(x.id)==String(id));['id','nama','jenisKelamin','tanggalLahir','hubungan','ayah','ibu','pasangan','alamat','deskripsi','foto'].forEach(k=>$(k).value=p[k]||'');if(p.foto)$('preview').innerHTML=`<img src="${esc(p.foto)}" style="max-width:180px">`}show('form')}async function save(e){e.preventDefault();try{let foto=$('foto').value,f=$('fotoFile').files[0];if(f){if(f.size>5*1024*1024)throw Error('Foto terlalu besar. Maksimal 5 MB.');let b=await base64(f);let u=await call('uploadPhoto',{base64:b.split(',')[1],mimeType:f.type,name:f.name});foto=u.url}let d={id:$('id').value,nama:$('nama').value,jenisKelamin:$('jenisKelamin').value,tanggalLahir:$('tanggalLahir').value,hubungan:$('hubungan').value,ayah:$('ayah').value,ibu:$('ibu').value,pasangan:$('pasangan').value,alamat:$('alamat').value,deskripsi:$('deskripsi').value,foto,token};let r=await call('savePerson',d);alert(r.message);hide('form');load()}catch(e){alert(e.message||e)}}function base64(f){return new Promise((r,j)=>{let x=new FileReader();x.onload=()=>r(x.result);x.onerror=j;x.readAsDataURL(f)})}async function del(id){if(!confirm('Hapus data ini?'))return;try{let r=await call('deletePerson',id,token);alert(r.message);load()}catch(e){alert(e.message)}}async function doLogin(e){e.preventDefault();try{let r=await call('login',$('username').value,$('password').value);if(!r.ok)return alert(r.message);token=r.token;sessionStorage.setItem('adminToken',token);hide('loginModal');ui();render()}catch(e){alert(e.message)}}async function doLogout(){await call('logout',token);token='';sessionStorage.removeItem('adminToken');ui();render()}function ui(){$('login').classList.toggle('hidden',!!token);$('logout').classList.toggle('hidden',!token)}function preview(){let f=$('fotoFile').files[0];if(f){if(f.size>5*1024*1024)return alert('Foto terlalu besar. Maksimal 5 MB.');$('preview').innerHTML=`<img src="${URL.createObjectURL(f)}" style="max-width:180px">`}}function big(u){$('bigImg').src=u;show('lightbox')}function show(id){$(id).classList.remove('hidden')}function hide(id){$(id).classList.add('hidden')}</script>
